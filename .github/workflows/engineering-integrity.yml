name: Engineering Integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Production boundary guard
        run: npm run production:guard
      - name: Typecheck (dashboard + worker)
        run: npm run typecheck
      - name: Smoke tests (ledger, security, pipeline)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Worker dry run
        run: npm run worker:dry-run
