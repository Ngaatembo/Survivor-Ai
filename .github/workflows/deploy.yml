name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: survivor-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run production:guard
      - run: npm run worker:dry-run -- --var BUILD_SHA:${{ github.sha }}
      - run: npm run worker:deploy -- --var BUILD_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Production runtime smoke test
        run: node scripts/productionSmoke.mjs
        env:
          SURVIVOR_EXPECTED_BUILD_SHA: ${{ github.sha }}
