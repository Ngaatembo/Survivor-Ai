# ============================================================================
# SURVIVE AI — Cloudflare Worker (headless autonomous loop runtime)
# ----------------------------------------------------------------------------
# Local dev:  npm run worker:dev        (uses .dev.vars)
# Deploy:     npm run worker:deploy
# Set secrets after first deploy:
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   npx wrangler secret put ANTHROPIC_API_KEY      (or OPENAI_API_KEY)
#   npx wrangler secret put TAVILY_API_KEY         (or BRAVE_API_KEY)
#   npx wrangler secret put TRIGGER_SECRET         (shared secret for HTTP trigger)
# ============================================================================

name = "survive-ai"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
# Non-secret configuration. Secrets are set via `wrangler secret put`.
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
AGENT_ID = "agent-survive-01"
# Cron schedule: every 30 minutes the agent runs one research cycle.
# Cron is always on; the agent self-throttles (dead = no-op).
[triggers]
crons = ["*/30 * * * *"]
